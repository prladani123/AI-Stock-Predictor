parameters:
  python_internal_url: '%env(PYTHON_INTERNAL_URL)%'
  internal_api_token: '%env(INTERNAL_API_TOKEN)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true
  App\:
    resource: '../src/'
    exclude: '../src/{DependencyInjection,Entity,Kernel.php}'
  App\Service\PythonClient:
    arguments:
      $baseUrl: '%python_internal_url%'
      $token: '%internal_api_token%'
